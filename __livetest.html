<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>face capture live test</title>
    <style>
      body { font-family: ui-monospace, monospace; margin: 0; background: #111; color: #eee; }
      .wrap { display: flex; gap: 12px; padding: 12px; flex-wrap: wrap; }
      .col { flex: 1; min-width: 320px; }
      video, #still { width: 100%; max-width: 420px; border-radius: 10px; background: #000; transform: scaleX(-1); }
      #still { display: none; }
      pre { font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
      .big { font-size: 22px; font-weight: 700; padding: 8px 0; }
      .ok { color: #4ade80; }
      .bad { color: #f87171; }
      .warn { color: #fbbf24; }
      h3 { margin: 12px 0 4px; }
      .seen span { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 6px; border-radius: 5px; background: #333; }
      .seen span.hit { background: #166534; color: #dcfce7; }
      button { font: inherit; padding: 6px 12px; margin-right: 8px; border-radius: 6px; border: 0; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="col">
        <video id="video" autoplay muted playsinline></video>
        <img id="still" alt="capture" />
        <div>
          <button id="resume">Resume camera</button>
          <button id="auto">Auto-capture: OFF</button>
          <button id="flip">Toggle mirror</button>
        </div>
        <div class="big" id="verdict">starting…</div>
        <div class="big" id="message"></div>
      </div>
      <div class="col">
        <pre id="panel"></pre>
        <h3>Cases observed</h3>
        <div class="seen" id="seen"></div>
      </div>
    </div>
    <script type="module" src="/src/__livetest.ts"></script>
  </body>
</html>
